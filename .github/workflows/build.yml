name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: discordpdf-jar
          path: target/discordpdf.jar

  docker:
    runs-on: ubuntu-latest
    needs: maven
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t discordpdf:ci .
