help.text=**discordpdf** — open-source, privacy-first PDF tools\n\
Every tool takes a file **upload** or a **url**. Results are only visible to you unless you set `public: True`.\n\n\
`/pdf merge` combine up to 10 PDFs\n\
`/pdf split` split by ranges (1-3,5,8-) or every N pages\n\
`/pdf compress` make a PDF smaller\n\
`/pdf pdf2md` · `/pdf md2pdf` PDF ⇄ Markdown\n\
`/pdf pdf2word` · `/pdf word2pdf` PDF ⇄ Word (.docx / .doc)\n\
`/pdf pdf2ppt` · `/pdf ppt2pdf` PDF ⇄ PowerPoint (.pptx / .ppt)\n\
`/pdf pdf2jpg` · `/pdf jpg2pdf` PDF ⇄ images\n\n\
Limits: input {0} per file, output {1}, {2} pages. See `/pdf privacy` for how files are handled.\n\
Source code: <https://github.com/RTX4O9O/DiscordPDF>

privacy.text=**What happens to your files**\n\
• Files are processed in a private temporary folder that is **deleted as soon as the job ends**, before the result is even sent back.\n\
• Nothing is stored: no database, no file history, no copies.\n\
• Logs contain only the tool name, success or failure and the duration — never file names, links, contents, user or server IDs.\n\
• Metadata that can identify people (author, editing software, EXIF / GPS in photos) is removed from the results.\n\
• Links are fetched only from public internet addresses, and nothing about you is sent with the request.\n\
• The bot does not read your messages; it only sees the slash commands you send it.\n\
• Results are private (ephemeral) by default.\n\
Everything is open source, so you can check this or run your own copy: <https://github.com/RTX4O9O/DiscordPDF>
