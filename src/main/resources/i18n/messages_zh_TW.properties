help.text=**discordpdf** — 開源、隱私優先的 PDF 工具\n\
每個工具都可以**上傳檔案**或提供**網址（url）**。結果預設只有你看得到，設定 `public: True` 才會公開。\n\n\
`/pdf merge` 合併最多 10 個 PDF\n\
`/pdf split` 依範圍（1-3,5,8-）或每 N 頁拆分\n\
`/pdf compress` 壓縮 PDF\n\
`/pdf pdf2md` · `/pdf md2pdf` PDF ⇄ Markdown\n\
`/pdf pdf2word` · `/pdf word2pdf` PDF ⇄ Word（.docx / .doc）\n\
`/pdf pdf2ppt` · `/pdf ppt2pdf` PDF ⇄ PowerPoint（.pptx / .ppt）\n\
`/pdf pdf2jpg` · `/pdf jpg2pdf` PDF ⇄ 圖片\n\n\
限制：單檔輸入 {0}、輸出 {1}、最多 {2} 頁。檔案處理方式請見 `/pdf privacy`。\n\
原始碼：<https://github.com/RTX4O9O/DiscordPDF>

privacy.text=**你的檔案會被怎麼處理**\n\
• 檔案在專屬的暫存資料夾中處理，**工作一結束就整個刪除**，甚至在結果回傳之前就已刪除。\n\
• 不保存任何東西：沒有資料庫、沒有檔案紀錄、沒有副本。\n\
• 紀錄檔只有工具名稱、成功或失敗與耗時，絕不記錄檔名、網址、內容、使用者或伺服器 ID。\n\
• 會移除結果檔中可識別個人的中繼資料（作者、編輯軟體、照片的 EXIF／GPS 位置）。\n\
• 只會從公開網際網路位址下載網址，請求中不會附帶任何關於你的資訊。\n\
• 機器人不會讀取你的訊息，只會收到你對它下的斜線指令。\n\
• 結果預設為僅自己可見（ephemeral）。\n\
全部開源，你可以自行檢查或架設自己的版本：<https://github.com/RTX4O9O/DiscordPDF>
