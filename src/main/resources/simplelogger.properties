# slf4j-simple configuration. Logs go to stdout; nothing is written to files.
org.slf4j.simpleLogger.logFile=System.out
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
# Third-party libraries can be chatty and may echo document details at debug level.
org.slf4j.simpleLogger.log.org.apache.pdfbox=error
org.slf4j.simpleLogger.log.org.apache.fontbox=error
org.slf4j.simpleLogger.log.org.apache.poi=error
org.slf4j.simpleLogger.log.com.openhtmltopdf=error
org.slf4j.simpleLogger.log.net.dv8tion=info
